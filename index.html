<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Open in Messages</title>
<style>
  :root{--bg:#f2f3f6;--fg:#14161b;--muted:#6b7180;--blue:#0a7cff;color-scheme:light dark}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0e11;--fg:#eef0f4;--muted:#9097a6}}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));box-sizing:border-box}
  main{max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px}
  .msg{align-self:flex-end;background:var(--blue);color:#fff;padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:88%;word-wrap:break-word}
  a.go{display:block;text-align:center;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:14px;border-radius:12px;font-size:17px}
  p{margin:0;color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="msg" id="msg"></div>
  <a class="go" id="go" href="#">Open in Messages</a>
  <p id="note">Opening Messages…</p>
</main>
<script>
// Link format: #n=<phone>&b=<url-encoded message>. The part after # never reaches a server.
(function(){
  var p=new URLSearchParams(location.hash.slice(1));
  var n=(p.get('n')||'').replace(/[^\d+]/g,''), b=p.get('b')||'';
  var msg=document.getElementById('msg'), go=document.getElementById('go'), note=document.getElementById('note');
  if(!n){ msg.hidden=true; go.hidden=true; note.textContent='This link is missing a phone number.'; return; }
  msg.textContent=b;
  var href='sms:'+n+'?&body='+encodeURIComponent(b);
  go.href=href;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  location.href=href;
  setTimeout(function(){ note.textContent='If Messages didn’t open, tap the button.'; },1200);
})();
</script>
</body>
</html>
